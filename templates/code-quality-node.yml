# managed-by: code-review-hub v2
name: Code Quality Check

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: code-quality-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: mkdir -p qr

      # ── Checks ───────────────────────────────────────────

      - name: ESLint
        id: lint
        run: |
          if jq -e '.scripts.lint | type == "string" and length > 0' package.json > /dev/null 2>&1; then
            if npm run lint > qr/lint.txt 2>&1; then RC=0; else RC=$?; fi
            cat qr/lint.txt
            printf 'status=%s\n' "$RC" >> "$GITHUB_OUTPUT"
          else
            echo "ℹ️ No lint script configured" | tee qr/lint.txt
            echo "status=skip" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: TypeScript Check
        id: typecheck
        run: |
          CMD=""
          if jq -e '.scripts.typecheck | type == "string" and length > 0' package.json > /dev/null 2>&1; then
            CMD="typecheck"
          elif jq -e '.scripts["type-check"] | type == "string" and length > 0' package.json > /dev/null 2>&1; then
            CMD="type-check"
          elif jq -e '.scripts["typecheck:local"] | type == "string" and length > 0' package.json > /dev/null 2>&1; then
            CMD="typecheck:local"
          fi
          if [ -n "$CMD" ]; then
            if npm run "$CMD" > qr/typecheck.txt 2>&1; then RC=0; else RC=$?; fi
            cat qr/typecheck.txt
            printf 'status=%s\n' "$RC" >> "$GITHUB_OUTPUT"
          else
            echo "ℹ️ No typecheck script configured" | tee qr/typecheck.txt
            echo "status=skip" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Tests
        id: test
        run: |
          if jq -e '.scripts.test | type == "string" and length > 0' package.json > /dev/null 2>&1; then
            TEST_CMD=$(jq -r '.scripts.test' package.json)
            if echo "$TEST_CMD" | grep -q "no test specified"; then
              echo "ℹ️ No tests configured" | tee qr/test.txt
              echo "status=skip" >> "$GITHUB_OUTPUT"
            else
              if npm test > qr/test.txt 2>&1; then RC=0; else RC=$?; fi
              cat qr/test.txt
              printf 'status=%s\n' "$RC" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "ℹ️ No test script found" | tee qr/test.txt
            echo "status=skip" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true
        env:
          NODE_OPTIONS: --max-old-space-size=512

      - name: Security Audit
        id: security
        run: |
          if npm audit --json > qr/security.json 2> qr/security.err; then AUDIT_RC=0; else AUDIT_RC=$?; fi
          if [ -s qr/security.json ]; then cp qr/security.json qr/security.txt; else cp qr/security.err qr/security.txt; fi

          CRITICAL=0
          HIGH=0
          STATUS=error
          if jq -e --argjson audit_rc "$AUDIT_RC" \
            'type == "object" and (.error == null) and
             (.vulnerabilities | type == "object") and
             ($audit_rc == 0 or (.vulnerabilities | length > 0))' \
            qr/security.json > /dev/null 2>&1; then
            if COUNTS=$(jq -r \
              '[([.vulnerabilities[] | select(.severity == "critical")] | length),
                ([.vulnerabilities[] | select(.severity == "high")] | length)] | @tsv' \
              qr/security.json 2>/dev/null); then
              IFS=$'\t' read -r CRITICAL HIGH <<< "$COUNTS"
              if [[ "$CRITICAL" =~ ^[0-9]+$ && "$HIGH" =~ ^[0-9]+$ ]]; then
                if [ "$CRITICAL" -gt 0 ]; then STATUS=critical
                elif [ "$HIGH" -gt 0 ]; then STATUS=high
                else STATUS=ok
                fi
              else
                CRITICAL=0
                HIGH=0
              fi
            fi
          fi
          printf 'critical=%s\nhigh=%s\nstatus=%s\n' "$CRITICAL" "$HIGH" "$STATUS" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      # ── Report: PR Comment ──────────────────────────────

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = f => { try { return fs.readFileSync(`qr/${f}`, 'utf8').trim(); } catch { return 'N/A'; } };
            const icon = s => s === 'skip' ? '⏭️' : s === '0' ? '✅' : s === 'ok' ? '✅' : '❌';
            const secIcon = s => s === 'critical' ? '🚨' : s === 'high' ? '⚠️' : s === 'ok' ? '✅' : s === 'skip' ? '⏭️' : '❌';

            const ls = '${{ steps.lint.outputs.status }}';
            const ts = '${{ steps.typecheck.outputs.status }}';
            const tt = '${{ steps.test.outputs.status }}';
            const ss = '${{ steps.security.outputs.status }}';

            const body = [
              '## 🔍 Code Quality Report', '',
              'Policy: required failures block after evidence; advisory findings remain visible; skip means not configured; error is required.', '',
              '| Check | Status |', '|-------|--------|',
              `| ESLint (advisory) | ${icon(ls)} |`,
              `| TypeScript (required) | ${icon(ts)} |`,
              `| Tests (required) | ${icon(tt)} |`,
              `| Security critical/error (required); high (advisory) | ${secIcon(ss)} |`, '',
              '<details><summary>📋 ESLint</summary>', '',
              '```', read('lint.txt').substring(0, 3000), '```', '</details>', '',
              '<details><summary>📋 TypeScript</summary>', '',
              '```', read('typecheck.txt').substring(0, 3000), '```', '</details>', '',
              '<details><summary>📋 Tests</summary>', '',
              '```', read('test.txt').substring(0, 3000), '```', '</details>', '',
              '<details><summary>📋 Security</summary>', '',
              '```', read('security.txt').substring(0, 3000), '```', '</details>', '',
              '---',
              `*🤖 [code-review-hub](https://github.com/${context.repo.owner}/code-review-hub) · \`${context.sha.substring(0,7)}\`*`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body?.includes('Code Quality Report') && c.body?.includes('code-review-hub'));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

      # ── Report: Webhook ─────────────────────────────────

      - name: Send webhook
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          [ -z "$WEBHOOK_URL" ] && exit 0
          jq -n \
            --arg event "code_quality" \
            --arg repo "${{ github.repository }}" \
            --arg ref "${{ github.ref }}" \
            --arg sha "${{ github.sha }}" \
            --arg lint "${{ steps.lint.outputs.status }}" \
            --arg typecheck "${{ steps.typecheck.outputs.status }}" \
            --arg test "${{ steps.test.outputs.status }}" \
            --arg security "${{ steps.security.outputs.status }}" \
            --arg critical "${{ steps.security.outputs.critical }}" \
            --arg high "${{ steps.security.outputs.high }}" \
            '{event:$event,repo:$repo,ref:$ref,sha:$sha,
              results:{lint:$lint,typecheck:$typecheck,test:$test,
              security:$security,critical_vulns:$critical,high_vulns:$high}}' |
          curl -sf -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" -d @- --max-time 30 || echo "⚠️ Webhook failed"

      # ── Report: Issue on critical problems ──────────────

      - name: Create issue (critical on main)
        if: |
          always() && github.event_name == 'push' &&
          (steps.security.outputs.status == 'critical' ||
           steps.security.outputs.status == 'error' ||
           (steps.lint.outputs.status != '0' && steps.lint.outputs.status != 'skip') ||
           (steps.typecheck.outputs.status != '0' && steps.typecheck.outputs.status != 'skip') ||
           (steps.test.outputs.status  != '0' && steps.test.outputs.status  != 'skip'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date +%Y-%m-%d)
          ico() { [ "$1" = "0" ] || [ "$1" = "ok" ] && echo "✅" || echo "❌"; }

          BODY="## 🚨 Code Quality Issues Detected

          **Branch:** \`${{ github.ref_name }}\`
          **Commit:** [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})

          | Check | Status |
          |-------|--------|
          | ESLint | $(ico ${{ steps.lint.outputs.status }}) |
          | TypeScript | $(ico ${{ steps.typecheck.outputs.status }}) |
          | Tests | $(ico ${{ steps.test.outputs.status }}) |
          | Security | $(ico ${{ steps.security.outputs.status }}) |

          [View full run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ---
          *🤖 [code-review-hub](https://github.com/${{ github.repository_owner }}/code-review-hub)*"

          set -o pipefail
          # Close previous auto-issues
          gh issue list --state open --search '"[Code Quality]" in:title "code-review-hub" in:body' --json number --jq '.[].number' 2>/dev/null | while read num; do
            gh issue close "$num" 2>/dev/null
          done

          echo "$BODY" | gh issue create \
            --title "[Code Quality] Проблемы — ${DATE}" \
            --body-file - \
            --label "code-quality,automated" 2>/dev/null || \
          echo "$BODY" | gh issue create \
            --title "[Code Quality] Проблемы — ${DATE}" \
            --body-file -

      - name: Enforce required quality gate
        if: always()
        env:
          TYPECHECK_STATUS: ${{ steps.typecheck.outputs.status }}
          TEST_STATUS: ${{ steps.test.outputs.status }}
          SECURITY_STATUS: ${{ steps.security.outputs.status }}
          SECURITY_CRITICAL: ${{ steps.security.outputs.critical }}
        run: |
          FAILED=0
          case "$TYPECHECK_STATUS" in 0|skip) ;; *) echo "TypeScript required check failed: $TYPECHECK_STATUS"; FAILED=1 ;; esac
          case "$TEST_STATUS" in 0|skip) ;; *) echo "Tests required check failed: $TEST_STATUS"; FAILED=1 ;; esac
          case "$SECURITY_STATUS" in ok|high) ;; *) echo "Security required check failed: $SECURITY_STATUS"; FAILED=1 ;; esac
          case "$SECURITY_CRITICAL" in 0) ;; *) echo "Critical vulnerabilities: $SECURITY_CRITICAL"; FAILED=1 ;; esac
          exit "$FAILED"
